<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport"
          content="width=device-width, height=device-height, initial-scale=1, interactive-widget=resizes-content" />
    <title>crow wasm probe</title>
  </head>
  <body style="margin: 0; overflow: hidden; background: #111">
    <div id="glcanvas" style="margin: 0; width: 100dvw; height: 100dvh"></div>
    <script type="module">
      window.__crowProbe = { stage: "loading" };
      import("./target/crow_web.js")
        .then((m) => m.default(new URL("target/crow_web_bg.wasm", window.location.origin)))
        .then(() => { window.__crowProbe.stage = window.__crowProbe.stage || "instantiated"; })
        .catch((e) => {
          window.__crowProbe.stage = "load-error";
          window.__crowProbe.error = String(e);
        });
    </script>
  </body>
</html>
