[workspace]
resolver = "2"
members = [
    "crow-cli",
    "crow-mcp",
    "crow-memory",
    "crow-memory-sdk",
    "crow-memory-types",
    "crow-server",
    "crow-verifier",
]

[workspace.dependencies]
# Shared across crates
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "process"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

