[package]
name = "crow-verifier"
version = "0.2.0"
edition = "2021"
description = "Verifier proxy — conductor component that intercepts idle, calls verifier daemon, acts on verdict tool call"
repository = "https://github.com/crow-cli/crow-cli"
license = "MIT"

[[bin]]
name = "crow-verifier"
path = "src/main.rs"

[dependencies]
agent-client-protocol = { git = "https://github.com/agentclientprotocol/rust-sdk.git", rev = "7d21931823e9515465794aaf000b61f427c6a595", features = ["unstable_protocol_v2"] }
agent-client-protocol-http = { git = "https://github.com/agentclientprotocol/rust-sdk.git", rev = "7d21931823e9515465794aaf000b61f427c6a595", features = ["client"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
