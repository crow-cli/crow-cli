[package]
name = "crow-web"
version = "0.1.0"
edition = "2021"
description = "crow-web: the rust state server behind the crow web client (fs buffers, ptys)"
license = "MIT"
repository = "https://github.com/crow-cli/crow-cli"
homepage = "https://crow-ai.dev"
keywords = ["acp", "agent", "web", "editor", "terminal"]
categories = ["development-tools"]

# A member but NOT a default member: a bare `cargo build`/`cargo test` at the
# repo root keeps building exactly the TUI it always did.
[[bin]]
name = "crow-web"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
futures = "0.3.34"
# What the embedded SPA's files are, by extension.
mime_guess = "2"
# The pty behind /pty. xterm.js is the emulator in the browser; this is only
# spawn/resize/kill plus the byte pump — no VT parsing on this side.
portable-pty = "0.9"
# The web client, compiled in: one executable, one origin.
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "fs", "net", "time", "sync", "process"] }
# The /acp proxy's upstream half; tests use it for the client half too.
tokio-tungstenite = "0.29"

# Read packages/chat/dist from disk instead of embedding it, so a frontend
# rebuild lands without a rust one.
[features]
dev-web = []


