[package]
name = "crow-client"
version = "0.1.0"
edition = "2021"
description = "Terminal-native ACP client for AI coding agents"
license = "MIT"
repository = "https://github.com/crow-cli/crow-cli"
homepage = "https://crow-ai.dev"
readme = "README.md"
keywords = ["acp", "agent", "tui", "terminal", "llm"]
categories = ["command-line-utilities", "development-tools"]
# The published .crate carries only what compiles and tests: the two pet PNGs
# are `include_bytes!` in src/pet.rs, and the layout tests read fixtures/ at
# $CARGO_MANIFEST_DIR. Screenshots and docs stay in the repo.
include = [
    "src/",
    "tests/",
    "fixtures/",
    "assets/pet/liang-idle.png",
    "assets/pet/liang-working.png",
    "README.md",
    "LICENSE",
]

# crow-gui is the runtime-agnostic UI service (native `--gui` window and the
# `--web` wasm runtime share one runner). It is a member but NOT a default
# member, so a bare `cargo build`/`cargo test` in this directory keeps building
# exactly the TUI binary it always did — the shipped TUI must not pay for wgpu.
[[bin]]
name = "crow"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
signal-hook = "0.3"
crossterm = "0.29"
ratatui = { version = "0.30.2", features = ["unstable-widget-ref"] }
ratatui-explorer = "0.3"
ratatui-textarea = "0.9.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ruzstd = "0.8"
unicode-segmentation = "1"
unicode-width = "0.2"
yaml-rust2 = "0.12"
tui-markdown = { version = "0.3.9", default-features = false }
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
tui-tree-widget = "0.24"
agent-client-protocol = { version = "2.0.0", features = ["unstable_auth_methods", "unstable_elicitation", "unstable_end_turn_token_usage", "unstable_protocol_v2"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "fs", "net", "time", "sync"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
futures = "0.3.34"
image = { version = "0.25", default-features = false, features = ["png"] }
# GUI backend for `--gui`: a native window with ratatui painted over wgpu, so a
# launcher can start crow with Terminal=false instead of depending on the
# compositor's terminal resolution. crow-gui is the UI service — it owns winit,
# ratatui-wgpu and the runner, and hosts anything implementing GuiApplication.
# Optional so the default TUI build compiles none of winit/wgpu.
crow-gui = { path = "../crow-gui", optional = true }

[features]
default = []
# Native GPU window. Off by default: the shipped TUI must not pay for wgpu.
gui = ["dep:crow-gui"]

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }

[package.metadata.deb]
maintainer = "Thomas Wood <odell.wood@gmail.com>"
copyright = "2026 Thomas Wood <odell.wood@gmail.com>"
license-file = ["LICENSE", "0"]
section = "devel"
priority = "optional"
depends = "$auto"
extended-description = """\
Crow is a terminal-native client for AI coding agents that speak the Agent
Client Protocol. It spawns an agent (by default `crow-cli acp2`), renders the
conversation as a transcript with syntax-highlighted code and diff cards, and
drives the agent from a vim-style composer."""
# Terminal=true launcher entry plus the hicolor ladder its Icon= key resolves
# through; without these the .deb installs a binary no app grid can find.
assets = [
    ["../../target/release/crow", "/usr/bin/crow", "755"],
    ["README.md", "/usr/share/doc/crow-client/README.md", "644"],
    # The GUI launcher entry (`Terminal=false`, `Exec=crow --gui`): this .deb is
    # built with the `gui` feature, so the app grid must open the window, not a
    # terminal. Swap the source to `packaging/crow.desktop` for the
    # `Terminal=true` entry the non-GUI package routes ship.
    ["packaging/crow-gui.desktop", "/usr/share/applications/crow.desktop", "644"],
    ["packaging/icons/hicolor/16x16/apps/crow.png", "/usr/share/icons/hicolor/16x16/apps/crow.png", "644"],
    ["packaging/icons/hicolor/22x22/apps/crow.png", "/usr/share/icons/hicolor/22x22/apps/crow.png", "644"],
    ["packaging/icons/hicolor/24x24/apps/crow.png", "/usr/share/icons/hicolor/24x24/apps/crow.png", "644"],
    ["packaging/icons/hicolor/32x32/apps/crow.png", "/usr/share/icons/hicolor/32x32/apps/crow.png", "644"],
    ["packaging/icons/hicolor/48x48/apps/crow.png", "/usr/share/icons/hicolor/48x48/apps/crow.png", "644"],
    ["packaging/icons/hicolor/64x64/apps/crow.png", "/usr/share/icons/hicolor/64x64/apps/crow.png", "644"],
    ["packaging/icons/hicolor/128x128/apps/crow.png", "/usr/share/icons/hicolor/128x128/apps/crow.png", "644"],
    ["packaging/icons/hicolor/256x256/apps/crow.png", "/usr/share/icons/hicolor/256x256/apps/crow.png", "644"],
    ["packaging/icons/hicolor/512x512/apps/crow.png", "/usr/share/icons/hicolor/512x512/apps/crow.png", "644"],
]
