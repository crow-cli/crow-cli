[project]
name = "crow-memory"
version = "0.1.34"
description = "Crow's memory store: SQLAlchemy over a db_uri (sqlite default, postgres-ready seam). Shared by crow-cli and crow-mcp."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "coolname>=2.2.0",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crow_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
