[project]
name = "crow-memory-sdk"
version = "0.1.32"
description = "Python client for the crow-memory HTTP service (LanceDB-backed agent memory)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "crow-memory-types>=0.1.32",
    "httpx>=0.28.1",
]

# Local monorepo build of the crow-memory-types wheel (maturin). Drops out
# when the wheels are published to PyPI — the metadata above already carries
# the registry dependency.
[tool.uv.sources]
crow-memory-types = { path = "../crow-memory-types" }

[project.urls]
Homepage = "https://github.com/crow-cli/crow-cli"
Repository = "https://github.com/crow-cli/crow-cli"
Issues = "https://github.com/crow-cli/crow-cli/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crow_memory_sdk"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
