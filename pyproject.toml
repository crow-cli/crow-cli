[project]
name = "crow-cli"
version = "0.1.46"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "agent-client-protocol[http]>=0.12.1",
    "aiosqlite>=0.22.1",
    "boto3>=1.40.0",
    "click>=8.4.0",
    "coolname>=2.2.0",
    "directory-tree>=1.0.0",
    "docker>=7.2.0",
    "fastmcp>=3.4.2",
    "httpx>=0.28.1",
    "hypercorn>=0.17",
    "ipykernel>=6.29.0",
    "jinja2>=3.1.6",
    "jupyter-client>=8.6.0",
    "markdownify>=0.14.0",
    "openai>=2.21.0",
    "opencv-python>=4.13.0.92",
    "packaging>=26.2",
    "pathspec>=1.1.1",
    "platformdirs>=4.9.6",
    "psutil>=7.2.2",
    "psycopg[binary]>=3.1",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "readabilipy>=0.3.0",
    "rich>=14.3.3",
    "setproctitle>=1.3.7",
    "sqlalchemy>=2.0",
    "typer>=0.24.1",
    "typeguard>=4.5.2",
    "typing-extensions>=4.15.0",
    "pillow>=12.3.0",
    "ast-grep-py>=0.45.3",
    "playwright>=1.62.0",
    "polars>=1.44.1",
    "ripgrep-rs>=0.4.2",
    "celery>=5.6.3",
    "tenacity>=9.1.4",
    "redis>=8.1.0",
]

[project.urls]
Homepage = "https://github.com/crow-cli/crow-cli"
Repository = "https://github.com/crow-cli/crow-cli"
Issues = "https://github.com/crow-cli/crow-cli/issues"
Documentation = "https://github.com/crow-cli/crow-cli#readme"

[project.scripts]
crow-cli = "crow_cli.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crow_cli"]

[dependency-groups]
dev = [
    "ipython>=9.10.0",
    "moto[s3,server]>=5.0.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
    "pyinstaller>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --strict-markers"

[tool.uv.sources]
# Local checkout of agentclientprotocol/python-sdk carrying the v2-over-HTTP
# work (https://github.com/agentclientprotocol/python-sdk/pull/163). Restore the
# versioned constraint above and delete this block once that ships upstream.
agent-client-protocol = { path = "/home/thomas/src/agentclientprotocol/python-sdk", editable = true }
