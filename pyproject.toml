[project]
name = "crow-cli"
version = "0.1.37"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "agent-client-protocol[http]>=0.12.0,<0.13.0",
    "hypercorn>=0.17",
    "coolname>=2.2.0",
    "directory-tree>=1.0.0",
    "docker>=7.2.0",
    "fastmcp>=3.4.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdownify>=0.14.0",
    "openai>=2.21.0",
    "opencv-python>=4.13.0.92",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "readabilipy>=0.3.0",
    "rich>=14.3.3",
    "sqlalchemy>=2.0",
    "typer>=0.24.1",
]

[project.urls]
Homepage = "https://github.com/crow-cli/crow-cli"
Repository = "https://github.com/crow-cli/crow-cli"
Issues = "https://github.com/crow-cli/crow-cli/issues"
Documentation = "https://github.com/crow-cli/crow-cli#readme"

[project.scripts]
crow-cli = "crow_cli.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crow_cli"]

[dependency-groups]
dev = [
    "ipython>=9.10.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
    "pyinstaller>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --strict-markers"
