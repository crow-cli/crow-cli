[project]
name = "crow-cli"
version = "0.1.41"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE.md" }
dependencies = [
    "agent-client-protocol[http]>=0.12.0,<0.13.0",
    # TUI layer derived from batrachianai/toad (see src/crow_cli/tui/NOTICE)
    "aiosqlite>=0.22.1",
    "bashlex==0.18",
    "boto3>=1.40.0",
    "click>=8.4.0",
    "coolname>=2.2.0",
    "directory-tree>=1.0.0",
    "docker>=7.2.0",
    "fastmcp>=3.4.2",
    "format-currency>=0.0.10",
    "httpx>=0.28.1",
    "hypercorn>=0.17",
    "jinja2>=3.1.6",
    "markdownify>=0.14.0",
    "notify-py>=0.3.43",
    "openai>=2.21.0",
    "opencv-python>=4.13.0.92",
    "packaging>=26.2",
    "pathspec>=1.1.1",
    "platformdirs>=4.9.6",
    "psutil>=7.2.2",
    "psycopg[binary]>=3.1",
    "pydantic>=2.12.5",
    "pyperclip>=1.11.0",
    "pyyaml>=6.0.3",
    "readabilipy>=0.3.0",
    "rich>=14.3.3",
    "setproctitle>=1.3.7",
    "sqlalchemy>=2.0",
    "textual[syntax]==8.2.7",
    "textual-diff-view==0.1.5",
    "textual-serve>=1.1.2",
    "textual-speedups==0.2.1",
    "typer>=0.24.1",
    "typeguard>=4.5.2",
    "typing-extensions>=4.15.0",
    "watchdog>=6.0.0",
    "xdg-base-dirs>=6.0.2",
]

[project.urls]
Homepage = "https://github.com/crow-cli/crow-cli"
Repository = "https://github.com/crow-cli/crow-cli"
Issues = "https://github.com/crow-cli/crow-cli/issues"
Documentation = "https://github.com/crow-cli/crow-cli#readme"

[project.scripts]
crow-cli = "crow_cli.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crow_cli"]

[dependency-groups]
dev = [
    "ipython>=9.10.0",
    "moto[s3,server]>=5.0.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
    "pyinstaller>=6.0.0",
    "pyte>=0.8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --strict-markers"
