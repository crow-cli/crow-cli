[package]
name = "crow-memory-types"
version = "0.1.32"
edition = "2021"
description = "Wire types for the crow-memory HTTP API — shared by server and SDK"
repository = "https://github.com/crow-cli/crow-cli"
license = "MIT"

[lib]
# cdylib for the maturin-built python wheel (feature "python"), rlib for
# rust consumers (crow-memory).
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:pyo3", "dep:pythonize"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
pyo3 = { version = "0.29", features = ["abi3-py314"], optional = true }
pythonize = { version = "0.29", optional = true }

[[bin]]
name = "gen-schema"
path = "src/bin/gen_schema.rs"
