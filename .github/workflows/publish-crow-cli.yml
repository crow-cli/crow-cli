name: Publish crow-cli to PyPI

# Manual-only publish of the single package in this repo. Idempotent: a
# version already live on PyPI is skipped, so a failed run can simply be
# re-dispatched.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/crow-cli
    permissions:
      id-token: write  # Required for trusted publishing
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Build and publish (skip if already on PyPI)
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')
          if curl -fsS "https://pypi.org/pypi/crow-cli/$VERSION/json" -o /dev/null; then
            echo "crow-cli $VERSION is already on PyPI — skipping publish"
          else
            uv build
            uv publish
          fi
