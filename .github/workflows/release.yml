name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 (glibc 2.35) for the widest forward reach on x86_64.
          - runner: ubuntu-22.04
            arch: x86_64
          # Native arm64 runner — no cross-compiling anywhere in this file.
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      # Hermetic build: protobuf-src compiles protoc from source (needs the
      # cmake + C++ toolchain already on ubuntu runners). No submodules needed
      # — vendor/ollama + vendor/llama.cpp are runtime provisioning, not build
      # inputs.
      - name: Build release binaries
        run: |
          cargo build --release \
            -p crow-cli -p crow-mcp -p crow-memory -p crow-server -p crow-verifier

      - name: Package
        run: |
          set -e
          ver=$(grep -m1 '^version' crow-cli/Cargo.toml | cut -d'"' -f2)
          dir="crow-v${ver}-linux-${{ matrix.arch }}"
          mkdir "$dir"
          for b in crow-cli crow-mcp crow-memory crow-server crow-verifier; do
            cp target/release/$b "$dir/"
          done
          tar czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            crow-*.tar.gz
            crow-*.tar.gz.sha256
