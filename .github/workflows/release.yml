name: Release

# ONE pipeline for the whole distribution chain, serialized top to bottom:
#
#   crates-io ──> pypi-types ──> pypi-sdk ──> pypi-clients
#   (types, then    (7 abi3       (pure-py     (crow-cli +
#    memory)         wheels)       wheel)       crow-mcp)
#
# crow-memory-types is the ur-artifact — the wire contract everything else
# is bolted onto — so it publishes first on both registries, and the whole
# PyPI track is gated on the crates.io job: if the ur-crate can't ship,
# nothing downstream ships either. One job per link; `needs` enforces the
# chain; within crates-io the steps are ordered types-first because
# crow-memory depends on it by version.
#
# Triggered by a GitHub release. Every manifest carries its own version —
# no auto-increment anywhere; re-runs skip what's already published.

on:
  release:
    types: [published]

jobs:
  # ── crates.io ────────────────────────────────────────────────────────────
  crates-io:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # crow-memory-types FIRST: crow-memory depends on it by version (the
      # path in its Cargo.toml is stripped by `cargo publish`). Idempotent —
      # versions already on crates.io are skipped.
      - name: Publish crow-memory-types
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' crow-memory-types/Cargo.toml | head -1)
          if curl -sf "https://crates.io/api/v1/crates/crow-memory-types/$v" > /dev/null; then
            echo "crow-memory-types $v already on crates.io — skipping"
          else
            cargo publish -p crow-memory-types
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Give the sparse index time to pick up crow-memory-types.
      - name: Wait for crates.io index
        run: sleep 60

      # --no-verify: skip compiling the full lance/arrow stack just to prove
      # the package builds — build-binaries already proves that.
      - name: Publish crow-memory
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' crow-memory/Cargo.toml | head -1)
          if curl -sf "https://crates.io/api/v1/crates/crow-memory/$v" > /dev/null; then
            echo "crow-memory $v already on crates.io — skipping"
          else
            cargo publish -p crow-memory --no-verify
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ── PyPI: crow-memory-types wheels (the ur-bindings) ────────────────────
  pypi-types:
    needs: crates-io
    strategy:
      fail-fast: false
      matrix:
        include:
          # abi3-py314: one wheel per platform target, works on 3.14+
          - os: ubuntu-latest
            target: x86_64
            manylinux: manylinux_2_28
          - os: ubuntu-latest
            target: aarch64
            manylinux: manylinux_2_28
          - os: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
          - os: ubuntu-latest
            target: aarch64
            manylinux: musllinux_1_2
          - os: macos-latest
            target: aarch64
          - os: macos-latest
            target: x86_64
          - os: windows-latest
            target: x64
    runs-on: ${{ matrix.os }}
    environment:
      name: pypi
      url: https://pypi.org/p/crow-memory-types
    permissions:
      id-token: write  # trusted publishing
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crow-memory-types
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Publish to PyPI
        run: uv publish crow-memory-types/dist/*.whl

  # ── PyPI: crow-memory-sdk (needs the types wheels installable) ──────────
  pypi-sdk:
    needs: pypi-types
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/crow-memory-sdk
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "crow-memory-sdk/pyproject.toml"

      - name: Build package
        working-directory: ./crow-memory-sdk
        run: uv build --wheel

      # Wheels only: the sdist would carry [tool.uv.sources] (dev-only path
      # overrides) in its pyproject.toml. The wheel metadata is clean —
      # `crow-memory-types>=<ver>` straight from the registry spec.
      - name: Publish to PyPI
        working-directory: ./crow-memory-sdk
        run: uv publish dist/*.whl

  # ── PyPI: crow-cli + crow-mcp (need the sdk installable) ────────────────
  pypi-clients:
    needs: pypi-sdk
    strategy:
      fail-fast: false
      matrix:
        package: [crow-cli, crow-mcp]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ matrix.package }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "${{ matrix.package }}/pyproject.toml"

      - name: Build package
        working-directory: ./${{ matrix.package }}
        run: uv build --wheel

      - name: Publish to PyPI
        working-directory: ./${{ matrix.package }}
        run: uv publish dist/*.whl
