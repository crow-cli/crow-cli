name: Publish crow-mcp to PyPI

# Manual only. Full releases go through release.yaml, which publishes
# crow-memory first and waits for it to be live on PyPI — crow-mcp requires
# crow-memory==<version>, so it must never race ahead of it.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/crow-mcp
    permissions:
      id-token: write  # Required for trusted publishing
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "crow-mcp/pyproject.toml"

      - name: Build package
        working-directory: ./crow-mcp
        run: uv build

      - name: Publish to PyPI
        working-directory: ./crow-mcp
        run: uv publish
