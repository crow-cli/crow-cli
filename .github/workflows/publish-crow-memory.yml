name: Publish crow-memory to crates.io

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Idempotent: skip whatever is already on crates.io (re-releases, or a
      # version published locally first). Manifest carries the version — no
      # auto-increment anywhere.
      - name: Publish crow-memory-types (if missing)
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' crow-memory-types/Cargo.toml | head -1)
          if curl -sf "https://crates.io/api/v1/crates/crow-memory-types/$v" > /dev/null; then
            echo "crow-memory-types $v already on crates.io — skipping"
          else
            cargo publish -p crow-memory-types
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Give the sparse index time to pick up crow-memory-types.
      - name: Wait for crates.io index
        run: sleep 60

      # --no-verify: skip compiling the full lance/arrow stack just to prove
      # the package builds — build-binaries already proves that. Publishing
      # only packages the crate.
      - name: Publish crow-memory (if missing)
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' crow-memory/Cargo.toml | head -1)
          if curl -sf "https://crates.io/api/v1/crates/crow-memory/$v" > /dev/null; then
            echo "crow-memory $v already on crates.io — skipping"
          else
            cargo publish -p crow-memory --no-verify
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
