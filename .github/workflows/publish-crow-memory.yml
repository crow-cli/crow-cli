name: Publish crow-memory to crates.io

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # crow-memory-types FIRST: crow-memory depends on it by version
      # (the path in its Cargo.toml is stripped by `cargo publish`), so the
      # types crate must be resolvable from crates.io before crow-memory.
      # Publishes whatever version the manifest carries — no auto-increment.
      - name: Publish crow-memory-types
        run: cargo publish -p crow-memory-types
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Give the sparse index time to pick up crow-memory-types.
      - name: Wait for crates.io index
        run: sleep 60

      # --no-verify: skip compiling the full lance/arrow stack just to prove
      # the package builds — build-binaries already proves that. Publishing
      # only packages the crate.
      - name: Publish crow-memory
        run: cargo publish -p crow-memory --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
