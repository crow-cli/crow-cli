name: Build Binaries

on:
  push:
    tags:
      - "v*" # Trigger on version tags like v0.1.13

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          [
            ubuntu-24.04,
            macos-15-intel,
            macos-latest,
            windows-latest,
            ubuntu-24.04-arm,
          ]
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
            archive_name: crow-cli-linux-x86_64.tar.gz
          - os: macos-15-intel
            target: darwin-x86_64
            archive_name: crow-cli-darwin-x86_64.tar.gz
          - os: macos-latest
            target: darwin-aarch64
            archive_name: crow-cli-darwin-aarch64.tar.gz
          - os: windows-latest
            target: windows-x86_64
            archive_name: crow-cli-windows-x86_64.zip
          - os: ubuntu-24.04-arm
            target: linux-aarch64
            archive_name: crow-cli-linux-aarch64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      # pyinstaller is in the dev group, so `uv run` resolves it along with the
      # project. The old `uv pip install --system pyinstaller` installed into
      # setup-python's interpreter, which is not the one the build uses.
      - name: Build with PyInstaller
        run: |
          uv run pyinstaller crow-cli.spec --noconfirm

      - name: Smoke-test the binary
        shell: bash
        run: |
          BIN=dist/crow-cli
          if [ "${{ runner.os }}" == "Windows" ]; then BIN=dist/crow-cli.exe; fi
          "$BIN" --version

      - name: Create archive
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" == "Windows" ]; then
            7z a -tzip ${{ matrix.archive_name }} crow-cli.exe
          else
            tar -czvf ${{ matrix.archive_name }} crow-cli
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crow-cli-${{ matrix.target }}
          # `Create archive` cds into dist/, so the archive is dist/<name>. This
          # was <name> at the workspace root for ten releases: upload-artifact's
          # default if-no-files-found is `warn`, so every build job passed with an
          # empty artifact, download-artifact merged nothing, and the release glob
          # matched nothing — a release with zero assets, all six jobs green.
          path: dist/${{ matrix.archive_name }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: crow-cli-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            crow-cli-*.tar.gz
            crow-cli-*.zip
          # Without this an unmatched glob publishes an assetless release and
          # exits 0 — which is what happened from v0.1.35 to v0.1.48.
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
