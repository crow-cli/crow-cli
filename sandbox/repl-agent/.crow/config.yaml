mcpServers:
  crow-mcp:
    transport: stdio
    command: uv
    args:
      - --project
      - /home/thomas/src/crow-ai/crow-cli/crow-mcp
      - run
      - crow-mcp

db_uri: sqlite:////home/thomas/.crow/crow.db
murder_db_uri: sqlite:////home/thomas/.crow/crow-murder.db

providers:
  litellm:
    base_url: http://localhost:4000/v1
    api_key: ${LITELLM_API_KEY}

  llamacpp:
    base_url: http://coast-after-3:1234/v1
    api_key: ${LLAMACPP_API_KEY}

models:
  qwen3.6-plus:
    provider: litellm
    model: qwen3.6-plus

  qwen3.5-122B-A10B:
    provider: llamacpp
    model: unsloth/Qwen3.5-122B-A10B-GGUF:Q4_K_M

  qwen3.5-plus:
    provider: litellm
    model: qwen3.5-plus

native_tools:
  - edit
  - write
  - read
  - terminal
  - web_search
  - web_fetch

MAX_COMPACT_TOKENS: 190000
