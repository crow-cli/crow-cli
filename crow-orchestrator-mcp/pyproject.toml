[project]
name = "crow-orchestrator-mcp"
version = "0.1.27"
description = "Orchestrator MCP server for sending batches of tasks to agent sessions"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=3.4.2",
]

[project.scripts]
crow-orchestrator-mcp = "crow_orchestrator_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crow_orchestrator_mcp"]
