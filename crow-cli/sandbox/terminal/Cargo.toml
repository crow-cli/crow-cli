[package]
name = "terminal-sandbox"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "terminal-sandbox"
path = "src/main.rs"

[dependencies]
nix = { version = "0.30", features = ["term", "process", "signal", "fs"] }
libc = "0.2"
strip-ansi-escapes = "0.2"
base64 = "0.22"
anyhow = "1"
serde_json = "1"
