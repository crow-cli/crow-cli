# Dev override for the session-fork worktree: isolate ALL fork work from the
# real crow.db until the one final migration (PLAN.md Phase 7).
# crow-3.db is a FRESH file created schema-v5 from scratch — no migration
# work mid-sprint. crow-2.db (v4) is left untouched until then.
# MCP servers come from THIS worktree's `crow-cli mcp`.
db_uri: ~/.agents/crow/crow-3.db
mcpServers:
  crow-mcp:
    transport: stdio
    command: uv
    args:
      - --project
      - /home/thomas/src/crow-team/crow-cli-session-fork/crow-cli
      - run
      - crow-cli
      - mcp
