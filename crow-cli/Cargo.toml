[package]
name = "crow-cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.88.0"
description = "crow-cli: AI agent CLI — ACP v2 client and agent"
repository = "https://github.com/crow-cli/crow-cli"
license = "MIT"

[[bin]]
name = "crow-cli"
path = "src/main.rs"

[lib]
name = "crow_cli"
path = "src/lib.rs"

[dependencies]
# ACP protocol — pinned to the exact rust-sdk commit we develop against.
# crates.io 2.0.0 is 10 commits behind this rev (missing conductor v2 proxy
# init #302, http slow-stream fix #292, unstable v2 APIs #295-#298); switch
# to a crates.io version once upstream publishes one that contains them.
agent-client-protocol = { git = "https://github.com/agentclientprotocol/rust-sdk.git", rev = "7d21931823e9515465794aaf000b61f427c6a595", features = ["unstable_protocol_v2", "unstable_auth_methods"] }

# Conductor (embedded proxy-chain orchestration for `crowctl run <chain>`)
agent-client-protocol-conductor = { git = "https://github.com/agentclientprotocol/rust-sdk.git", rev = "7d21931823e9515465794aaf000b61f427c6a595", features = ["unstable_protocol_v2"] }

# ACP-over-HTTP transport for `crowctl serve` (9.6)
agent-client-protocol-http = { git = "https://github.com/agentclientprotocol/rust-sdk.git", rev = "7d21931823e9515465794aaf000b61f427c6a595", features = ["server", "client"] }
axum = "0.8"

# LLM
async-openai-thinking = { package = "async-openai-thinking", version = "0.41.5", features = ["chat-completion"] }

# MCP
rmcp = { version = "2.2", features = ["client", "transport-child-process", "schemars"] }

# Terminal emulation. Bit-for-bit alacritty @ 4c129667 (the rev zed-industries
# pins), published from crow-cli/alacritty because git deps cannot ship via
# crates.io. Key keeps the original crate name — no code changes.
alacritty_terminal = { package = "crow-alacritty-terminal", version = "0.2.0" }

# Streaming markdown rendering for agent text (PLAN 12.2 RAINBOW)
# streamdown-render 0.1.4 on crates.io hangs forever on table cells wider than
# their column budget (byte-len vs display-width confusion in the force-truncate
# loop). Upstream merged the fix (PR #5) but never released it, so we published
# the fixed tree ourselves as the crow-streamdown-* rename
# (github.com/crow-cli/streamdown-rs). Keys keep the original crate names so no
# code changes; switch back to streamdown-* once upstream releases > 0.1.4.
streamdown-parser = { package = "crow-streamdown-parser", version = "0.2.0" }
streamdown-render = { package = "crow-streamdown-render", version = "0.2.0" }

# Memory (shared crate)
crow-memory-sdk = { path = "../crow-memory-sdk", version = "0.2.0" }

# Async runtime
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "process", "signal"] }
tokio-util = "0.7"
futures = "0.3"

# Config
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
dotenvy = "0.15"
shellexpand = "3"
dirs = "6"

# Templates
handlebars = "6"

# HTTP (embeddings)
reqwest = { version = "0.12", features = ["json"] }

# Crypto (template hash)
sha2 = "0.10"

# Time
chrono = "0.4"

# Random (coolname)
rand = "0.9"

# CLI
clap = { version = "4", features = ["derive"] }
rpassword = "7"

# Unix signals (daemon stop)
libc = "0.2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"

# Order-preserving maps (config: first model = default)
indexmap = { version = "2", features = ["serde"] }

# Diffing (edit tool → ACP v2 Diff content)
similar = "2"

# Terminal output decoding (ACP Terminal schema carries base64)
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
# Tests spin up the real memory server on a temp LanceDB (production path).
crow-memory = { path = "../crow-memory", version = "0.2.0" }
