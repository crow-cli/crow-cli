# crow client settings — agent servers + named conductor chains.
#
# agent_servers: Zed-style server declarations (command/args/env).
# chains: named conductor proxy chains; the LAST component must be the agent.
# `crow-cli run <name>` resolves either; `crow-cli run <chain> -p PROMPT.md`
# drives the whole chain. Model selection rides NewSessionRequest._meta.model.
#
# Default path: crow = disposable stdio RELAY -> crow-daemon (acp --http).
# Sessions live in the daemon; kill/respawn the relay freely.
# crow-local is the old embedded in-process agent, kept for A/B fallback.
#
# Paths below are absolute — the HOME / CONFIG_DIR / DEFAULT_MODEL
# placeholders are substituted by `crow-cli init` at write time.

default: crow

agent_servers:
  # Memory service: axum + LanceDB single writer. Agents and crow-mcp are
  # SDK clients; this is the only process that touches the db.
  crow-memory:
    type: custom
    command: {{HOME}}/.cargo/bin/crow-memory
    args: [--config, {{CONFIG_DIR}}/config.yaml]
    port: 27697

  # Resident daemon: owns sessions, react loops (memory via crow-memory).
  crow-daemon:
    type: custom
    command: {{HOME}}/.cargo/bin/crow-cli
    args: [acp, --http, --port, "2769"]
    port: 2769
    requires: [crow-memory]

  # Disposable relay — what ACP clients (zed, crow-cli run) spawn.
  crow:
    command: {{HOME}}/.cargo/bin/crow-cli
    args: [acp, --relay, "http://127.0.0.1:2769"]
    requires: [crow-daemon]
    default_config_options:
      model: {{DEFAULT_MODEL}}

  # Embedded in-process agent (pre-daemon behavior).
  crow-local:
    command: {{HOME}}/.cargo/bin/crow-cli
    args: [acp]
    requires: [crow-memory]
    default_config_options:
      model: {{DEFAULT_MODEL}}

  crow-verifier:
    type: custom
    command: {{HOME}}/.cargo/bin/crow-verifier
    args: ["--verifier-url", "http://localhost:8081", "--max-rounds", "2"]
    requires: [verifier-daemon]

  verifier-daemon:
    type: custom
    command: {{HOME}}/.cargo/bin/crow-server
    args: ["--port", "8081", "-o", "{{CONFIG_DIR}}/configs/verifier.yaml"]
    port: 8081

  # Multivector embedding service (our ollama fork) — blue/green on 11392.
  # `crow-cli daemon install ollama-mv` builds it from source if missing and
  # promotes it to a systemd user unit.
  ollama-mv:
    type: custom
    command: {{CONFIG_DIR}}/vendor/ollama/ollama
    args: [serve]
    env:
      OLLAMA_HOST: 127.0.0.1:11392
      OLLAMA_MODELS: {{HOME}}/.local/share/ollama-mv-models
    port: 11392

chains:
  verifier:
    components: [crow-verifier, crow]
