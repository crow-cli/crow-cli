[package]
name = "crow-mcp"
version = "0.2.0"
edition = "2021"
description = "crow MCP server — terminal + edit tools over stdio"
repository = "https://github.com/crow-cli/crow-cli"
license = "MIT"

[[bin]]
name = "crow-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "2.2", features = ["server", "transport-io", "macros", "schemars"] }
crow-memory-sdk = { path = "../crow-memory-sdk", version = "0.2.0" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.30", features = ["term", "process", "signal", "fs"] }
libc = "0.2"
strip-ansi-escapes = "0.2"
base64 = "0.22"
anyhow = "1"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
similar = "2"

# Vision
nokhwa = { version = "0.10", features = ["input-native"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Web tools
reqwest = { version = "0.12", features = ["json"] }
readability = "0.3"
htmd = "0.2"
url = "2"
